<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classical CV & Machine Vision — Learning Roadmap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem 1rem; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }
  .progress-wrap { background: #e0e0d8; border-radius: 20px; height: 8px; margin-bottom: 6px; }
  .progress-bar { background: #1D9E75; height: 8px; border-radius: 20px; transition: width 0.3s; }
  .progress-label { font-size: 13px; color: #666; margin-bottom: 2rem; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab { font-size: 13px; padding: 6px 16px; border-radius: 20px; border: 1px solid #ddd; background: white; color: #666; cursor: pointer; }
  .tab.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .section { margin-bottom: 2rem; }
  .section-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e0e0d8; }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .topic-card { background: white; border: 1px solid #e8e8e0; border-radius: 12px; padding: 16px; cursor: default; transition: border-color 0.15s; }
  .topic-card.done { border-left: 4px solid #1D9E75; opacity: 0.7; }
  .topic-card.done .card-title { text-decoration: line-through; color: #999; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 600; color: #1a1a1a; line-height: 1.4; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; font-weight: 500; }
  .badge-critical { background: #FAECE7; color: #993C1D; }
  .badge-important { background: #FAEEDA; color: #854F0B; }
  .badge-good { background: #EAF3DE; color: #3B6D11; }
  .card-desc { font-size: 13px; color: #555; line-height: 1.6; margin-bottom: 10px; }
  .card-code { font-family: 'Courier New', monospace; font-size: 11px; background: #f5f5f0; padding: 10px 12px; border-radius: 8px; color: #444; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .check-btn { margin-top: 10px; font-size: 12px; color: #555; background: none; border: 1px solid #ddd; border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  .check-btn:hover { background: #f5f5f0; }
  .done .check-btn { color: #1D9E75; border-color: #1D9E75; }
</style>
</head>
<body>

<h1>Classical CV & Machine Vision — Learning Roadmap</h1>
<p class="subtitle">Built after your Taymer interview. Close these gaps before the next industrial CV role.</p>

<div class="progress-wrap"><div class="progress-bar" id="pbar" style="width:0%"></div></div>
<p class="progress-label" id="plabel">0 of 20 topics completed</p>

<div class="tab-row">
  <div class="tab active" onclick="filterTab('all', this)">All topics</div>
  <div class="tab" onclick="filterTab('critical', this)">Critical gaps</div>
  <div class="tab" onclick="filterTab('important', this)">Important</div>
  <div class="tab" onclick="filterTab('good', this)">Good to know</div>
</div>

<div id="cards-container"></div>

<script>
const topics = [
  {
    title: "Image difference & golden reference",
    priority: "critical",
    desc: "The core of industrial defect detection. Compare a test image against a known-good reference using absolute difference. This is exactly what Taymer asked you in the interview.",
    code: "diff = cv2.absdiff(reference, test)\n_, thresh = cv2.threshold(diff, 30, 255, cv2.THRESH_BINARY)\ncontours, _ = cv2.findContours(\n    thresh, cv2.RETR_EXTERNAL,\n    cv2.CHAIN_APPROX_SIMPLE\n)"
  },
  {
    title: "Thresholding — fixed, Otsu & adaptive",
    priority: "critical",
    desc: "Converting grayscale to binary. Fixed threshold fails under lighting variation. Otsu automatically finds optimal threshold. Adaptive computes per-region — best for uneven lighting.",
    code: "# Fixed\ncv2.threshold(gray, 127, 255, cv2.THRESH_BINARY)\n\n# Otsu — auto threshold\ncv2.threshold(gray, 0, 255, cv2.THRESH_OTSU)\n\n# Adaptive — per-region\ncv2.adaptiveThreshold(gray, 255,\n    cv2.ADAPTIVE_THRESH_GAUSSIAN_C,\n    cv2.THRESH_BINARY, 11, 2)"
  },
  {
    title: "Edge detection — Canny & Sobel",
    priority: "critical",
    desc: "Detecting surface anomalies and boundaries. Canny is the standard pipeline. Sobel gives gradient direction. Know when to use each and how to tune parameters.",
    code: "# Canny — full pipeline, most common\nedges = cv2.Canny(gray, 50, 150)\n\n# Sobel — gradient direction\nsobelx = cv2.Sobel(gray, cv2.CV_64F, 1, 0, ksize=3)\nsobely = cv2.Sobel(gray, cv2.CV_64F, 0, 1, ksize=3)\nmagnitude = np.sqrt(sobelx**2 + sobely**2)"
  },
  {
    title: "Morphological operations",
    priority: "critical",
    desc: "Erosion shrinks regions, dilation expands. Opening removes noise. Closing fills holes and connects broken defect regions. Critical step after thresholding before contour detection.",
    code: "kernel = cv2.getStructuringElement(\n    cv2.MORPH_RECT, (5,5))\n\n# Remove small noise\nopened = cv2.morphologyEx(\n    binary, cv2.MORPH_OPEN, kernel)\n\n# Fill gaps in defect region\nclosed = cv2.morphologyEx(\n    binary, cv2.MORPH_CLOSE, kernel)"
  },
  {
    title: "Contour detection & analysis",
    priority: "critical",
    desc: "Finding shapes, measuring area, perimeter, bounding boxes. Used to locate and characterize defects after binary thresholding. Know how to filter by area.",
    code: "contours, _ = cv2.findContours(\n    binary, cv2.RETR_EXTERNAL,\n    cv2.CHAIN_APPROX_SIMPLE)\n\nfor c in contours:\n    area = cv2.contourArea(c)\n    if area < 50: continue  # filter noise\n    x, y, w, h = cv2.boundingRect(c)\n    cv2.rectangle(img, (x,y), (x+w,y+h), (0,0,255), 2)"
  },
  {
    title: "Camera calibration",
    priority: "critical",
    desc: "Intrinsic/extrinsic parameters, lens distortion correction. Mandatory for accurate measurements. A scratch that looks 2mm wide might actually be 1.5mm without calibration.",
    code: "# Calibrate using chessboard pattern\nret, mtx, dist, rvecs, tvecs = cv2.calibrateCamera(\n    objpoints, imgpoints,\n    gray.shape[::-1], None, None)\n\n# Apply to every frame before processing\nundistorted = cv2.undistort(\n    frame, mtx, dist, None, mtx)"
  },
  {
    title: "Line scan vs area scan cameras",
    priority: "critical",
    desc: "Line scan captures one row at a time — the image builds as the product moves past. Used for continuous products like wire/cable at high speed. Area scan = full 2D frame for stationary objects.",
    code: "# Conceptual — no OpenCV code\n#\n# Line scan camera:\n# - Captures 1 pixel row per trigger pulse\n# - Image assembled as product moves\n# - No motion blur on fast moving products\n# - Unlimited product length inspection\n#\n# Area scan camera:\n# - Full 2D frame per capture\n# - Better for stationary or slower targets"
  },
  {
    title: "Encoder-triggered capture",
    priority: "critical",
    desc: "Camera fires based on encoder position pulses, not time. Guarantees consistent pixels-per-mm resolution regardless of line speed variation. Core to Taymer's architecture.",
    code: "# Conceptual — hardware concept\n#\n# Encoder emits N pulses per mm of travel\n# Vision system listens for pulse → grabs frame\n# Result: pixel density is FIXED regardless of speed\n#\n# If line speeds up: more pulses per second\n# But still same pulses per mm → same resolution\n#\n# Critical for accurate dimensional measurement"
  },
  {
    title: "Histogram equalization & CLAHE",
    priority: "important",
    desc: "Normalizing image contrast under varying lighting. Standard histogram equalization can over-amplify. CLAHE (Contrast Limited Adaptive HE) is the production-grade version.",
    code: "# Standard HE — global, can over-amplify\neq = cv2.equalizeHist(gray)\n\n# CLAHE — local, production preferred\nclahe = cv2.createCLAHE(\n    clipLimit=2.0, tileGridSize=(8,8))\nclahe_img = clahe.apply(gray)"
  },
  {
    title: "Template matching",
    priority: "important",
    desc: "Finding a known pattern within an image. Used for alignment verification, presence/absence checks, and print position verification — directly relevant to Taymer's PV1400.",
    code: "result = cv2.matchTemplate(\n    image, template, cv2.TM_CCOEFF_NORMED)\n_, max_val, _, max_loc = cv2.minMaxLoc(result)\n\nif max_val > 0.8:  # tune threshold\n    top_left = max_loc\n    h, w = template.shape\n    cv2.rectangle(image, top_left,\n        (top_left[0]+w, top_left[1]+h), (0,255,0), 2)"
  },
  {
    title: "Blob detection",
    priority: "important",
    desc: "Detecting circular or uniform regions by area, circularity, convexity. Useful for counting pinholes or detecting foreign particles. Simpler than contour analysis for round defects.",
    code: "params = cv2.SimpleBlobDetector_Params()\nparams.filterByArea = True\nparams.minArea = 50\nparams.maxArea = 5000\nparams.filterByCircularity = True\nparams.minCircularity = 0.5\n\ndetector = cv2.SimpleBlobDetector_create(params)\nkeypoints = detector.detect(gray)"
  },
  {
    title: "Image moments & orientation",
    priority: "important",
    desc: "Computing centroid, orientation angle, and shape properties from contours. Used for detecting misalignment and rotation deviation in manufactured parts.",
    code: "M = cv2.moments(contour)\nif M['m00'] != 0:\n    cx = int(M['m10'] / M['m00'])\n    cy = int(M['m01'] / M['m00'])\n\n# Orientation angle\nangle = 0.5 * np.arctan2(\n    2 * M['mu11'],\n    M['mu20'] - M['mu02'])"
  },
  {
    title: "Gaussian & median filtering",
    priority: "important",
    desc: "Noise removal before processing. Gaussian smooths uniformly. Median preserves edges while removing salt-and-pepper noise — preferred for depth sensor data and grainy inspection images.",
    code: "# Gaussian — general smoothing\nblurred = cv2.GaussianBlur(gray, (5,5), 1.5)\n\n# Median — preserves edges, removes impulse noise\nmedian = cv2.medianBlur(gray, 5)\n\n# Always apply BEFORE edge detection or thresholding"
  },
  {
    title: "Data augmentation vs synthetic generation",
    priority: "important",
    desc: "These are different things. Augmentation = transforms of real images. Synthetic = generating new realistic defect images. You confused these in the interview — know the difference precisely.",
    code: "# AUGMENTATION — transforms of real images\n# flip, rotate, brightness, contrast, crop, noise\n# Use: albumentations or torchvision.transforms\n\n# SYNTHETIC GENERATION — new defect images\n# Method 1: Copy-paste augmentation\n#   - Cut real defect patch from labeled image\n#   - Paste onto clean product at random position\n#   - Blend edges with Poisson blending\n# Method 2: GAN-based (CycleGAN, pix2pix)\n#   - Train to inject defect texture onto clean images"
  },
  {
    title: "Defect classification pipeline",
    priority: "important",
    desc: "Binary (defect/no defect) and multi-class (pinhole, scratch, lump, neckdown). Know the full training pipeline including dataset structure, class imbalance handling, and validation.",
    code: "# Dataset folder structure\n# /train/clean/\n# /train/defect/pinhole/\n# /train/defect/scratch/\n# /train/defect/lump/\n# /val/  (same structure, 20% split)\n\n# Handle class imbalance — defects are rare\n# Option 1: weighted loss\ncriterion = nn.CrossEntropyLoss(weight=class_weights)\n# Option 2: oversample minority class\n# Option 3: undersample majority class"
  },
  {
    title: "Two-stage detection pipeline",
    priority: "important",
    desc: "Your answer in the interview — detect and crop product first, then run defect classifier. This is the correct production architecture. Know it precisely with code.",
    code: "# Stage 1: product localization\n# Find where the product is in frame\nbbox = localizer.detect(frame)  # returns x,y,w,h\nx, y, w, h = bbox\ncropped = frame[y:y+h, x:x+w]\n\n# Stage 2: defect classification on cropped ROI\n# Only process the product, not background\ndefect_result = classifier.predict(cropped)\n\n# Why: background noise won't confuse defect model\n# Memory efficient: small input to second model\n# Modular: can swap either model independently"
  },
  {
    title: "OCR for print verification",
    priority: "important",
    desc: "Reading text printed on wire/cable — lot numbers, footage markers, date codes. Preprocessing is everything. Taymer's PV1400 does exactly this on high-speed line scan.",
    code: "import cv2, pytesseract\n\n# Preprocessing pipeline\ngray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n_, binary = cv2.threshold(\n    gray, 0, 255,\n    cv2.THRESH_BINARY + cv2.THRESH_OTSU)\n\n# Deskew if needed, then OCR\ntext = pytesseract.image_to_string(\n    binary,\n    config='--psm 7'  # single line of text\n)\n\n# Validate against expected pattern\nimport re\nif re.match(r'\\d{4}-\\d{2}-\\d{2}', text.strip()):\n    print('Print verified')"
  },
  {
    title: "Lighting for industrial inspection",
    priority: "good",
    desc: "Software can't fix bad lighting. Raking light for surface scratches. Backlight for silhouette/dimensional. Coaxial for reflective surfaces. Diffuse ring for general surface. Know which to recommend.",
    code: "# Not code — critical domain knowledge\n#\n# Raking light (low angle, 10-30 degrees):\n#   Best for: scratches, surface texture, embossing\n#   Why: shadows emphasize surface topology\n#\n# Backlight (behind product):\n#   Best for: dimensional measurement, silhouette\n#   Why: product appears as dark shape on bright bg\n#\n# Coaxial (on-axis, same direction as camera):\n#   Best for: flat reflective surfaces, PCBs\n#\n# Diffuse dome:\n#   Best for: general surface, minimizes glare"
  },
  {
    title: "ISO 9001 & quality systems",
    priority: "good",
    desc: "Taymer is ISO9001:2015 registered. Means documented processes, traceability, calibration records. For medical device work add ISO 13485. Know the concepts — you'll encounter them on the job.",
    code: "# Not code — compliance knowledge\n#\n# ISO 9001:2015 — quality management system\n#   Key: document everything, traceability\n#   Every inspection result logged with timestamp\n#   Equipment calibration records maintained\n#\n# ISO 13485 — medical device specific\n#   Stricter version of 9001 for medical\n#   CAPA: corrective and preventive action\n#   Design controls, risk management (ISO 14971)\n#\n# In practice: your code needs audit trails"
  },
  {
    title: "PLC communication basics",
    priority: "good",
    desc: "PLCs control manufacturing lines. Vision systems send pass/fail results to PLCs. Not expected to program PLCs but know how the interface works — it will come up at customer sites.",
    code: "# Not code — industrial communication concepts\n#\n# Digital I/O (simplest):\n#   Pass = HIGH signal on output pin\n#   Fail = LOW signal → PLC stops line\n#\n# Modbus TCP (common, open standard):\n#   Vision PC writes to PLC register\n#   import pymodbus\n#\n# EtherNet/IP (Rockwell/Allen-Bradley):\n#   Most common in North American plants\n#\n# OPC-UA:\n#   Modern standard, rising adoption\n#   Vendor-neutral, secure"
  }
];

let done = new Set();
let activeTab = 'all';

function filterTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function toggle(i) {
  if (done.has(i)) done.delete(i);
  else done.add(i);
  render();
}

function render() {
  const totalDone = done.size;
  const pct = Math.round((totalDone / topics.length) * 100);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('plabel').textContent = totalDone + ' of ' + topics.length + ' topics completed — ' + pct + '%';

  const filtered = topics.filter(t => activeTab === 'all' || t.priority === activeTab);
  const sections = ['critical','important','good'];
  const labels = {
    critical: 'Critical gaps — learn these first',
    important: 'Important — round out your knowledge',
    good: 'Good to know — domain context'
  };

  let html = '';
  sections.forEach(sec => {
    const sTopics = filtered.filter(t => t.priority === sec);
    if (!sTopics.length) return;
    html += '<div class="section"><div class="section-title">' + labels[sec] + '</div><div class="topic-grid">';
    sTopics.forEach(t => {
      const i = topics.indexOf(t);
      const isDone = done.has(i);
      const badgeClass = 'badge-' + sec;
      const badgeLabel = sec === 'critical' ? 'Critical' : sec === 'important' ? 'Important' : 'Good to know';
      html += `<div class="topic-card ${isDone ? 'done' : ''}">
        <div class="card-header">
          <div class="card-title">${t.title}</div>
          <span class="badge ${badgeClass}">${badgeLabel}</span>
        </div>
        <div class="card-desc">${t.desc}</div>
        <div class="card-code">${t.code}</div>
        <button class="check-btn" onclick="toggle(${i})">${isDone ? '✓ Mark incomplete' : 'Mark complete'}</button>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('cards-container').innerHTML = html;
}

render();
</script>
</body>
</html>
